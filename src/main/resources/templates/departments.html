<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="vi" th:replace="~{layout :: page(~{::main})}"><main><div class="page-heading"><div><span class="eyebrow">DANH MỤC CHUYÊN MÔN</span><h1>Bộ môn</h1><p class="muted">Tổ chức chuyên môn và phạm vi quản lý đề tài.</p></div><a class="button primary" href="/forms/departments" th:if="${me.has('SYSTEM_ADMIN') or me.has('FACULTY_MANAGER')}">+ Thêm bộ môn</a></div><div class="topic-grid"><article class="panel" th:each="d : ${departments}"><span class="eyebrow" th:text="${d.code}"></span><h2 th:text="${d.name}"></h2><p class="muted" th:text="${'Trưởng bộ môn: '+d.head}"></p><div class="actions" th:if="${me.has('SYSTEM_ADMIN') or me.has('FACULTY_MANAGER')}"><a class="button subtle" th:href="@{/forms/departments(id=${d.id})}">Chỉnh sửa</a><form th:action="@{/departments/{id}/delete(id=${d.id})}" method="post" data-confirm="Xóa bộ môn chưa được sử dụng?"><button class="button danger">Xóa</button></form></div></article></div></main></html>
