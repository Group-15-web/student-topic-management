<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  lang="vi"
  th:replace="~{layout :: page(~{::main})}"
>
  <main>
    <div class="page-heading">
      <div>
        <span class="eyebrow">CỘNG TÁC THỰC HIỆN</span>
        <h1>Nhóm đề tài</h1>
        <p class="muted">Những cộng sự cùng bạn biến ý tưởng thành hiện thực.</p>
      </div>
      <a
        href="/forms/groups"
        class="button primary"
        th:if="${me.has('STUDENT')}"
        >+ Tạo nhóm</a
      >
    </div>
    <div class="topic-grid">
      <article
        class="panel group-card"
        th:each="g : ${groups}"
      >
        <span
          class="badge"
          th:text="${g.invited ? 'Lời mời đang chờ' : g.status}"
        ></span>
        <h2>
          <a
            th:href="@{/groups/{id}(id=${g.id})}"
            th:text="${g.name}"
          ></a>
        </h2>
        <p
          class="muted"
          th:text="${g.cycle}"
        ></p>
        <div class="member-stack">
          <span
            class="avatar"
            th:each="mem : ${g.members}"
            th:text="${#strings.substring(mem.name,0,1)}"
            th:title="${mem.name}"
          ></span>
        </div>
        <p th:text="${g.min+'–'+g.max+' thành viên khi đăng ký'}"></p>
        <div class="card-bottom">
          <span
            th:text="${g.leader ? 'Bạn là nhóm trưởng' : g.member ? 'Thành viên' : 'Theo dõi / Lời mời'}"
          ></span
          ><a th:href="@{/groups/{id}(id=${g.id})}">Chi tiết →</a>
        </div>
      </article>
    </div>
    <div
      class="empty"
      th:if="${groups.isEmpty()}"
    >
      <span>♧</span>
      <h3>Chưa có nhóm nào</h3>
      <p>Tạo nhóm mới hoặc chờ lời mời từ nhóm trưởng.</p>
    </div>
  </main>
</html>
