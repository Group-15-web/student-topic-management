<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><div class="pagination" th:fragment="pagination" th:if="${data != null}"><span th:text="${'Trang '+data.number+' / '+data.totalPages+' · '+data.total+' kết quả'}"></span><a class="button subtle" th:if="${data.number > 1}" th:href="@{${path}(q=${data.query},cycleId=${cycleId},departmentId=${departmentId},cycleType=${cycleType},supervisor=${supervisor},sort=${sort},page=${data.number-1})}">← Trước</a><a class="button subtle" th:if="${data.number < data.totalPages}" th:href="@{${path}(q=${data.query},cycleId=${cycleId},departmentId=${departmentId},cycleType=${cycleType},supervisor=${supervisor},sort=${sort},page=${data.number+1})}">Sau →</a></div><form class="filterbar" th:fragment="search" method="get"><input name="q" th:value="${data.query}" placeholder="Tìm kiếm trong danh sách…" aria-label="Tìm kiếm"><button class="button primary">Tìm kiếm</button></form></html>
