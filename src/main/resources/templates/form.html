<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main><a class="backlink" th:href="@{${'/'+type}}">← Quay lại danh sách</a><div class="page-heading"><div><span class="eyebrow">THIẾT LẬP THÔNG TIN</span><h1 th:text="${title}"></h1><p class="muted">Các thao tác được kiểm tra theo vai trò, thời hạn và trạng thái hiện tại.</p></div></div><form class="panel editor" th:action="@{/forms/{type}(type=${type})}" method="post" th:object="${form}"><input th:if="${type != 'groups'}" type="hidden" th:field="*{id}"><div class="flash danger" th:if="${#fields.hasAnyErrors()}">Vui lòng kiểm tra các trường được đánh dấu bên dưới.</div><div class="form-grid"><div th:each="field : ${fields}" class="form-field" th:classappend="${field.type == 'textarea' ? 'wide' : ''}"><label th:for="${field.name}" th:text="${field.label}"></label><th:block th:switch="${field.type}">
<textarea th:case="'textarea'" th:field="*{__${field.name}__}" rows="7"></textarea>
<select th:case="'select'" th:field="*{__${field.name}__}"><option value="">— Chọn / để trống nếu không áp dụng —</option><option th:each="o : ${field.options}" th:value="${o.id}" th:text="${o.label}"></option></select>
<select th:case="'multiple'" multiple th:field="*{__${field.name}__}"><option th:each="o : ${field.options}" th:value="${o.id}" th:text="${o.label}"></option></select>
<input th:case="'checkbox'" type="checkbox" th:field="*{__${field.name}__}">
<select th:case="'cycleType'" th:field="*{cycleType}"><option value="COURSE">Môn học</option><option value="RESEARCH">Nghiên cứu khoa học</option><option value="SPECIALIZED_PROJECT">Tiểu luận chuyên ngành</option><option value="GRADUATION_THESIS">Khóa luận tốt nghiệp</option></select>
<select th:case="'cycleStatus'" th:field="*{status}"><option value="DRAFT">Nháp</option><option value="ACTIVE">Hoạt động</option><option value="CLOSED">Đóng</option><option value="ARCHIVED">Lưu trữ</option></select>
<select th:case="'announcementStatus'" th:field="*{status}"><option value="DRAFT">Nháp</option><option value="PUBLISHED">Công bố</option><option value="ARCHIVED">Lưu trữ</option></select>
<select th:case="'role'" th:field="*{role}"><option value="STUDENT">Sinh viên</option><option value="LECTURER">Giảng viên</option><option value="DEPARTMENT_HEAD">Trưởng bộ môn</option><option value="FACULTY_MANAGER">Trưởng khoa</option><option value="SYSTEM_ADMIN">Quản trị hệ thống</option></select>
<select th:case="'audience'" th:field="*{audience}"><option value="ALL">Tất cả người dùng</option><option value="STUDENT">Sinh viên</option><option value="LECTURER">Giảng viên</option><option value="DEPARTMENT_HEAD">Trưởng bộ môn</option><option value="FACULTY_MANAGER">Trưởng khoa</option><option value="SYSTEM_ADMIN">Quản trị</option></select>
<input th:case="*" th:type="${field.type}" th:field="*{__${field.name}__}" th:autocomplete="${field.type == 'password' ? 'new-password' : 'off'}">
</th:block><small class="muted" th:text="${field.hint}"></small><small class="field-error" th:errors="*{__${field.name}__}"></small></div></div><div class="form-footer"><span class="muted">Thời gian nghiệp vụ: Việt Nam (UTC+7).</span><div class="actions"><a class="button subtle" th:href="@{${'/'+type}}">Hủy</a><button class="button primary">Lưu thông tin →</button></div></div></form></main></html>
