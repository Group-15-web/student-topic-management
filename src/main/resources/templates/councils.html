<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="vi" th:replace="~{layout :: page(~{::main})}"><main><div class="page-heading"><div><span class="eyebrow">PHẢN BIỆN & ĐÁNH GIÁ</span><h1>Hội đồng & lịch báo cáo</h1><p class="muted">Phân công minh bạch, đánh giá độc lập.</p></div><a th:if="${me.has('FACULTY_MANAGER')}" class="button primary" href="/forms/councils">+ Thành lập hội đồng</a></div><div class="topic-grid"><article class="panel" th:each="c : ${councils}"><span class="badge" th:text="${c.cycle}"></span><h2 th:text="${c.name}"></h2><p><b th:text="${c.schedule}"></b></p><p th:text="${c.location}"></p><div class="divider"></div><div class="simple-row" th:each="member : ${c.members}" th:text="${member}"></div><div class="card-bottom"><a href="/registrations">Các hồ sơ được giao →</a><a th:if="${me.has('FACULTY_MANAGER')}" th:href="@{/forms/councils(id=${c.id})}" class="button subtle small">Sửa</a><form th:if="${me.has('FACULTY_MANAGER')}" th:action="@{/councils/{id}/delete(id=${c.id})}" method="post" data-confirm="Xóa hội đồng chưa được giao đề tài?"><button class="button danger small">Xóa</button></form></div></article></div><div class="empty" th:if="${councils.isEmpty()}"><h3>Chưa có hội đồng trong phạm vi của bạn</h3><p>Lịch sẽ xuất hiện khi nhóm được phân công.</p></div></main></html>
