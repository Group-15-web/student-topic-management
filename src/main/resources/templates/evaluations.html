<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="vi" th:replace="~{layout :: page(~{::main})}"><main><div class="page-heading"><div><span class="eyebrow">KHÔNG GIAN GIẢNG VIÊN</span><h1>Đánh giá & chấm điểm</h1><p class="muted">Chỉ hiển thị phiếu thuộc phân công và quyền quản lý của bạn.</p></div></div><div class="table-wrap"><table><thead><tr><th>Đề tài / nhóm</th><th>Người chấm</th><th>Loại</th><th>Điểm</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="e : ${evaluations}"><td><b th:text="${e.topic}"></b><small th:text="${e.group}"></small></td><td th:text="${e.evaluator}"></td><td th:text="${e.type}"></td><td><b th:text="${e.score}"></b></td><td><span class="badge" th:text="${e.status}"></span></td><td><a th:if="${e.mine}" th:href="@{/evaluations/{id}(id=${e.id})}">Mở phiếu ↗</a><a th:unless="${e.mine}" th:href="@{/registrations/{id}(id=${e.registrationId})}">Hồ sơ ↗</a></td></tr><tr th:if="${evaluations.isEmpty()}"><td colspan="6" class="empty-cell">Bạn chưa có phiếu đánh giá được phân công.</td></tr></tbody></table></div></main></html>
