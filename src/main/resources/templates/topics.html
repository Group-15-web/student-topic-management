<!DOCTYPE html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout :: page(~{::main})}"
>
  <main>
    <div class="page-heading">
      <div>
        <span class="eyebrow">Ý TƯỞNG & NGHIÊN CỨU</span>
        <h1>Khám phá đề tài</h1>
        <p class="muted">Tìm hướng nghiên cứu phù hợp với đam mê của bạn.</p>
      </div>
      <a
        class="button primary"
        href="/forms/topics"
        th:if="${me.has('LECTURER') or me.has('FACULTY_MANAGER')}"
        >+ Đề xuất đề tài</a
      >
    </div>
    <form
      class="filterbar"
      method="get"
      action="/topics"
    >
      <input
        name="q"
        th:value="${data.query}"
        placeholder="Tìm theo tên, nội dung, giảng viên…"
        aria-label="Tìm đề tài"
      /><select
        name="cycleId"
        aria-label="Đợt"
      >
        <option value="">Tất cả đợt</option>
        <option
          th:each="c : ${cycles}"
          th:value="${c.id}"
          th:text="${c.name}"
          th:selected="${c.id == cycleId}"
        ></option></select
      ><select
        name="departmentId"
        aria-label="Bộ môn"
      >
        <option value="">Tất cả bộ môn</option>
        <option
          th:each="d : ${departments}"
          th:value="${d.id}"
          th:text="${d.label}"
          th:selected="${d.id == departmentId}"
        ></option></select
      ><select
        name="cycleType"
        aria-label="Loại đề tài"
      >
        <option value="">Tất cả loại</option>
        <option
          th:each="type : ${ {'COURSE','RESEARCH','SPECIALIZED_PROJECT','GRADUATION_THESIS'} }"
          th:value="${type}"
          th:text="${type}"
          th:selected="${type == cycleType}"
        ></option></select
      ><input
        name="supervisor"
        th:value="${supervisor}"
        placeholder="Tên giảng viên hướng dẫn"
        aria-label="Giảng viên hướng dẫn"
      /><select
        name="sort"
        aria-label="Sắp xếp"
      >
        <option
          value="newest"
          th:selected="${sort == 'newest'}"
        >
          Mới nhất
        </option>
        <option
          value="title"
          th:selected="${sort == 'title'}"
        >
          Tên đề tài A–Z
        </option></select
      ><button class="button primary">Tìm kiếm</button
      ><a
        class="button subtle"
        href="/topics"
        >Xóa lọc</a
      >
    </form>
    <div class="list-meta">
      <b th:text="${data.total+' đề tài'}"></b
      ><span>Được hiển thị theo quyền truy cập của bạn</span>
    </div>
    <div class="topic-grid">
      <article
        class="topic-card"
        th:each="t : ${data.items}"
      >
        <div class="card-top">
          <span
            class="badge"
            th:text="${t.department}"
          ></span
          ><span class="card-arrow">↗</span>
        </div>
        <h3>
          <a
            th:href="@{/topics/{id}(id=${t.id})}"
            th:text="${t.title}"
          ></a>
        </h3>
        <p
          class="line-clamp"
          th:text="${t.description}"
        ></p>
        <div class="topic-meta">
          <span th:text="${t.cycle}"></span><span th:text="${'GVHD: '+t.supervisors}"></span
          ><span th:text="${'Còn '+(t.maxGroups-t.occupied)+' / '+t.maxGroups+' chỗ'}"></span>
        </div>
        <div class="card-bottom">
          <span
            class="status"
            th:text="${t.status}"
          ></span
          ><a th:href="@{/topics/{id}(id=${t.id})}">Xem chi tiết →</a>
        </div>
      </article>
    </div>
    <div
      class="empty"
      th:if="${data.items.isEmpty()}"
    >
      <span>⌕</span>
      <h3>Chưa tìm thấy đề tài</h3>
      <p>Thử đổi từ khóa, bộ môn hoặc đợt đăng ký.</p>
    </div>
    <div th:replace="~{fragments :: pagination}"></div>
  </main>
</html>
