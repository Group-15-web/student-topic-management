<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  lang="vi"
  th:replace="~{layout :: page(~{::main})}"
>
  <main>
    <div class="page-heading">
      <div>
        <span class="eyebrow">THÔNG TIN TỪ NHÀ TRƯỜNG & KHOA</span>
        <h1>Bảng thông báo</h1>
        <p class="muted">Cập nhật kịp thời các hoạt động và mốc thời gian quan trọng.</p>
      </div>
      <a
        class="button primary"
        href="/forms/announcements"
        th:if="${me.has('SYSTEM_ADMIN') or me.has('FACULTY_MANAGER') or me.has('DEPARTMENT_HEAD')}"
        >+ Viết thông báo</a
      >
    </div>
    <article
      class="panel announcement"
      th:each="a : ${announcements}"
    >
      <div class="section-heading">
        <span
          class="eyebrow"
          th:text="${a.time+' · '+a.author}"
        ></span
        ><span
          class="badge"
          th:text="${a.status}"
        ></span>
      </div>
      <h2 th:text="${a.title}"></h2>
      <div
        class="prose"
        th:text="${a.content}"
      ></div>
      <div class="card-bottom">
        <span
          class="muted"
          th:text="${'Đối tượng: '+a.audience}"
        ></span>
        <div
          class="actions"
          th:if="${a.editable}"
        >
          <a
            class="button subtle small"
            th:href="@{/forms/announcements(id=${a.id})}"
            >Chỉnh sửa</a
          >
          <form
            th:action="@{/announcements/{id}/delete(id=${a.id})}"
            method="post"
            data-confirm="Xóa thông báo này?"
          >
            <button class="button danger small">Xóa</button>
          </form>
        </div>
      </div>
    </article>
    <div
      class="empty"
      th:if="${announcements.isEmpty()}"
    >
      <h3>Chưa có thông báo</h3>
    </div>
  </main>
</html>
