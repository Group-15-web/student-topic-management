<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="vi" th:replace="~{layout :: page(~{::main})}"><main><div class="page-heading"><div><span class="eyebrow">TÀI KHOẢN CÁ NHÂN</span><h1>Hồ sơ của bạn</h1><p class="muted" th:text="${me.email}"></p></div><form th:action="@{/logout}" method="post"><button class="button subtle">Đăng xuất ↗</button></form></div><div class="two-columns"><form class="panel" th:action="@{/profile}" method="post"><h2>Thông tin cá nhân</h2><label>Họ và tên<input name="fullName" th:value="${me.name}" maxlength="100" required></label><label>Email<input th:value="${me.email}" disabled></label><p class="muted">Liên hệ quản trị để thay đổi email, mã hồ sơ hoặc bộ môn.</p><div class="badges"><span class="badge" th:each="r : ${me.roles}" th:text="${r}"></span></div><button class="button primary">Lưu thông tin</button></form><form class="panel" th:action="@{/profile/password}" method="post"><h2>Đổi mật khẩu</h2><label>Mật khẩu hiện tại<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>Mật khẩu mới<input name="newPassword" type="password" minlength="10" maxlength="72" autocomplete="new-password" required></label><p class="muted">Từ 10 đến 72 ký tự. Không sử dụng mật khẩu demo cho dữ liệu thật.</p><button class="button primary">Cập nhật mật khẩu</button></form></div></main></html>
