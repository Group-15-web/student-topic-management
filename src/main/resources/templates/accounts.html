<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="vi" th:replace="~{layout :: page(~{::main})}"><main><div class="page-heading"><div><span class="eyebrow">QUẢN LÝ NGƯỜI DÙNG</span><h1>Tài khoản & hồ sơ</h1><p class="muted">Hồ sơ sinh viên, giảng viên và quyền truy cập.</p></div><a class="button primary" href="/forms/accounts" th:if="${me.has('SYSTEM_ADMIN')}">+ Tạo tài khoản</a></div><div th:replace="~{fragments :: search}"></div><div class="table-wrap"><table><thead><tr><th>Họ tên / email</th><th>Mã / bộ môn</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="a : ${data.items}"><td><b th:text="${a.name}"></b><small th:text="${a.email}"></small></td><td><b th:text="${a.code}"></b><small th:text="${a.department}"></small></td><td><span class="role-text" th:text="${a.role}"></span></td><td><span class="badge" th:text="${a.enabled ? 'Hoạt động' : 'Đã khóa'}"></span></td><td><div class="actions"><a class="button subtle small" th:if="${me.has('SYSTEM_ADMIN') or me.has('FACULTY_MANAGER')}" th:href="@{/forms/accounts(id=${a.id})}">Sửa</a><form th:if="${me.has('SYSTEM_ADMIN')}" th:action="@{/accounts/{id}/toggle(id=${a.id})}" method="post"><button class="button subtle small" th:text="${a.enabled ? 'Khóa' : 'Mở khóa'}"></button></form><form th:if="${me.has('SYSTEM_ADMIN')}" th:action="@{/accounts/{id}/delete(id=${a.id})}" method="post" data-confirm="Chỉ xóa được tài khoản chưa có dữ liệu nghiệp vụ. Tiếp tục?"><button class="button danger small">Xóa</button></form></div><details th:if="${me.has('SYSTEM_ADMIN')}"><summary>Quyền bổ sung</summary><form th:action="@{/accounts/{id}/roles(id=${a.id})}" method="post"><select name="role" aria-label="Chọn role"><option value="DEPARTMENT_HEAD">Trưởng bộ môn</option><option value="FACULTY_MANAGER">Trưởng khoa</option><option value="LECTURER">Giảng viên</option><option value="SYSTEM_ADMIN">Quản trị</option></select><div class="actions"><button class="button subtle small" name="grant" value="true">Cấp</button><button class="button danger small" name="grant" value="false">Thu hồi</button></div></form></details></td></tr><tr th:if="${data.items.isEmpty()}"><td colspan="5" class="empty-cell">Không tìm thấy hồ sơ.</td></tr></tbody></table></div><div th:replace="~{fragments :: pagination}"></div></main></html>
