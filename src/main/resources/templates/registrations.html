<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  lang="vi"
  th:replace="~{layout :: page(~{::main})}"
>
  <main>
    <div class="page-heading">
      <div>
        <span class="eyebrow">THEO DÕI TOÀN BỘ HÀNH TRÌNH</span>
        <h1>Hồ sơ đề tài</h1>
        <p class="muted">Đăng ký, báo cáo, phân công và kết quả trong cùng một hồ sơ.</p>
      </div>
    </div>
    <div th:replace="~{fragments :: search}"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nhóm / đề tài</th>
            <th>Đợt đăng ký</th>
            <th>Trạng thái</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="r : ${data.items}">
            <td><b th:text="${r.group}"></b><small th:text="${r.topic}"></small></td>
            <td th:text="${r.cycle}"></td>
            <td>
              <span
                class="badge"
                th:text="${r.status}"
              ></span>
            </td>
            <td><a th:href="@{/registrations/{id}(id=${r.id})}">Mở hồ sơ ↗</a></td>
          </tr>
          <tr th:if="${data.items.isEmpty()}">
            <td
              colspan="4"
              class="empty-cell"
            >
              Chưa có hồ sơ đăng ký trong phạm vi của bạn.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div th:replace="~{fragments :: pagination}"></div>
  </main>
</html>
